<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1440">
<title>Rep Rivals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#130e2e; --bg2:#1d1645; --panel:#2a2160; --panel2:#3a2f7a; --edge:#0f0b26;
  --text:#f3f1ff; --muted:#b2a9e0; --mint:#5fe0a0; --orange:#ec6440; --orangeD:#b0401f; --gold:#f5b85a; --sky:#8fd9ff; --red:#e8573a;
  --navh:calc(84px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Rubik,system-ui,sans-serif;overscroll-behavior:none;overflow:hidden}
button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none;padding:0}
.hidden{display:none!important}
.screen{position:fixed;left:0;right:0;top:0;bottom:var(--navh);overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:520px;margin:0 auto;position:relative}

/* ---------- shared bits ---------- */
.gempill{display:flex;align-items:center;gap:8px;background:var(--bg2);border:4px solid var(--edge);border-radius:999px;padding:6px 16px 6px 12px;font-weight:800;font-size:20px;letter-spacing:2px;color:var(--sky)}
.gempill svg{width:22px;height:22px}
.gempill.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.18)}}
.hp{position:relative;height:30px;background:var(--edge);border-radius:999px;border:4px solid var(--edge);overflow:hidden}
.hp>i{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:999px;transition:width .3s}
.hp>i.ghost{background:#fff8;transition:width .9s .25s}
.hp>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:3px;color:#fff}
.dot{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--red);border:4px solid var(--edge)}
.title{font-weight:900;letter-spacing:6px;font-size:30px;text-align:center}
.roundbtn{width:58px;height:58px;border-radius:50%;background:var(--panel);border:5px solid var(--edge);display:flex;align-items:center;justify-content:center}
.roundbtn svg{width:26px;height:26px}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;height:var(--navh);background:var(--bg);display:flex;justify-content:center;padding-top:10px;z-index:10}
nav .in{display:flex;width:100%;max-width:520px;justify-content:space-around}
nav button{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:17px;letter-spacing:1px;color:var(--muted);position:relative}
nav .ic{width:92px;height:42px;border-radius:999px;display:flex;align-items:center;justify-content:center}
nav .ic svg{width:28px;height:28px}
nav button.on{color:#fff}
nav button.on .ic{background:#5a2433}
nav button.on .ic svg{color:var(--gold)}
nav .dot{top:-6px;right:14px;width:18px;height:18px}

/* ---------- boss screen ---------- */
#boss{overflow:hidden}
#boss .land{position:absolute;inset:0}
#boss .land svg{width:100%;height:100%}
.bossui{position:relative;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 14px 14px;max-width:520px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between}
.topbar .title{font-size:26px;white-space:nowrap;letter-spacing:4px;color:#fff;text-shadow:0 2px 0 #0002}
.bname{font-weight:900;letter-spacing:5px;font-size:34px;text-align:center;margin-top:12px;color:#fff}
.worth{align-self:center;display:flex;gap:8px;align-items:center;background:var(--bg2);border:4px solid var(--edge);border-radius:999px;padding:6px 18px;font-weight:800;color:var(--gold);letter-spacing:3px;font-size:15px;margin-top:6px}
.worth svg{width:18px;height:18px}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.stage .creature{width:min(70%,320px);max-height:100%;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1.5deg)}}
.stage .arrow{position:absolute;top:30%}
.stage .arrow.l{left:0}.stage .arrow.r{right:0}
.defeatedtag{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);border:5px solid var(--mint);color:var(--mint);font-weight:900;letter-spacing:4px;font-size:30px;padding:6px 16px;border-radius:12px;background:#0006}
.buildings{display:flex;justify-content:space-around;align-items:flex-end;margin-top:-10px}
.bld{position:relative;width:46%;display:flex;flex-direction:column;align-items:center}
.bld .badge{width:52px;height:52px;border-radius:50%;background:var(--bg2);border:5px solid var(--edge);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.bld .badge svg{width:30px;height:30px}
.bld .art{width:100%}
.bld .art svg{width:100%;height:auto;display:block}
.bld .lv{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:var(--edge);color:var(--gold);font-weight:800;font-size:12px;letter-spacing:2px;padding:3px 10px;border-radius:999px}
.bld .dot{right:16%;bottom:18%}
.fightrow{display:flex;gap:12px;align-items:stretch;margin-top:8px}
.fightbtn{flex:1;background:var(--orange);border:6px solid var(--edge);border-radius:999px;font-size:38px;font-weight:900;letter-spacing:8px;color:#fff;padding:14px 0;box-shadow:inset 0 -8px 0 #0002}
.fightbtn:active{transform:scale(.97)}
.battery{position:relative;width:118px;background:var(--edge);border-radius:22px 22px 0 0;overflow:visible;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0}
.battery .h{display:flex;gap:6px;align-items:center;background:var(--panel2);align-self:stretch;margin:0 6px;border-radius:16px 16px 0 0;justify-content:center;font-weight:800;letter-spacing:2px;font-size:13px;padding:6px 0}
.battery .h svg{width:12px;height:18px}
.battery b{color:var(--orange);font-size:24px;font-weight:900;letter-spacing:2px;margin-top:6px}
.battery small{color:var(--muted);font-weight:700;letter-spacing:1px}
.battery.full b{color:var(--mint)}
.battery .dot{top:-10px;right:-8px}

/* ---------- sword screen ---------- */
.phead{background:linear-gradient(#3d2a6e,#2f2462);padding:calc(env(safe-area-inset-top) + 14px) 14px 18px;position:sticky;top:0;z-index:2}
.phead .row{display:flex;align-items:center;justify-content:center;position:relative;max-width:520px;margin:0 auto}
.phead .gempill{position:absolute;right:0}
.sbody{background:linear-gradient(#2b2160,#1d1645);min-height:100%;padding:18px 16px 30px}
.bigsword{width:min(62%,250px);aspect-ratio:1;margin:6px auto 0;background:var(--edge);border-radius:36px;display:flex;align-items:center;justify-content:center;border:4px solid #241b52}
.bigsword svg{width:78%;height:78%}
.swname{text-align:center;font-weight:900;letter-spacing:5px;font-size:34px;margin-top:20px}
.swdmg{text-align:center;color:var(--gold);font-weight:800;letter-spacing:3px;font-size:20px;margin-top:4px}
.next{border:6px solid var(--edge);border-radius:30px;padding:18px;margin-top:24px;background:#2a2160}
.next .lbl{text-align:center;font-weight:800;letter-spacing:4px;font-size:18px}
.next .mid{display:flex;align-items:center;margin-top:12px}
.next .sw{width:40%;text-align:center}
.next .sw svg{width:76px;height:96px}
.next .sw div{font-weight:800;letter-spacing:3px;font-size:16px;margin-top:4px}
.next .stat{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:36px}
.next .stat svg{width:30px;height:30px}
.next .bot{display:flex;align-items:center;gap:14px;margin-top:16px}
.prog{flex:1;height:30px;background:var(--edge);border-radius:999px;border:4px solid var(--edge);overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);border-radius:999px;transition:width .4s}
.buybtn{position:relative;background:var(--gold);color:#fff;font-weight:900;letter-spacing:4px;font-size:26px;padding:14px 26px;border-radius:999px;border:6px solid var(--edge)}
.buybtn.off{opacity:.55}
.buybtn .lk{position:absolute;top:-12px;right:-4px;width:24px;height:24px;color:var(--gold)}
.h2{font-weight:800;letter-spacing:4px;font-size:18px;margin:28px 4px 14px}
.blade{display:flex;align-items:center;gap:14px;border:5px solid var(--edge);border-radius:24px;padding:16px 18px;margin-bottom:12px;background:#271e5a}
.blade svg.i{width:28px;height:28px;flex:none}
.blade .nm{flex:1;font-weight:700;font-size:20px;letter-spacing:1px}
.blade .ct{font-weight:800;letter-spacing:2px;color:var(--sky);font-size:17px}
.blade .dm{font-weight:800;letter-spacing:2px;font-size:17px;min-width:92px;text-align:right}
.blade.cur{border-color:#8fb877;background:#3a3075}
.blade.cur .nm{font-weight:900}
.blade.lock .nm{color:#c9c2ee}

/* ---------- progress screen ---------- */
.tabs{display:flex;justify-content:space-around;border-bottom:3px solid #fff;margin:0 -14px;padding:0 14px;max-width:none}
.tabs button{font-weight:800;letter-spacing:3px;font-size:15px;color:var(--muted);padding:14px 4px 12px;position:relative}
.tabs button.on{color:var(--gold)}
.tabs button.on:after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:7px;background:var(--gold);border-radius:6px 6px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{min-width:0;border:6px solid var(--edge);border-radius:26px;background:#2a2160;aspect-ratio:.92;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;gap:8px}
.tile .pic{width:100%;flex:1;border-radius:18px;overflow:hidden;position:relative}
.tile .pic svg{position:absolute;inset:0;width:100%;height:100%}
.tile .pic .c{inset:12% 18% 8%;width:64%;height:80%}
.tile .nm{font-weight:800;letter-spacing:1px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:#ddd8f6}
.tile.cur .nm{color:var(--mint)}
.tile .lockic{flex:1;display:flex;align-items:center}
.tile .lockic svg{width:42px;height:42px;color:#bdb4ea}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal div{aspect-ratio:1;border-radius:14px;background:#271e5a;border:3px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;color:var(--muted);font-size:12px}
.cal div b{color:#fff;font-size:15px;font-weight:900}
.cal .dw{background:none;border:0;aspect-ratio:auto;letter-spacing:2px}
.cal .hit{background:#2f7a5a;color:#d6ffe9}
.cal .today{border-color:var(--gold)}
.cal .fut{opacity:.35}
.calhead{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 14px;font-weight:900;letter-spacing:3px;font-size:18px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.cards3 div{background:var(--edge);border-radius:18px;padding:12px 6px;text-align:center}
.cards3 b{display:block;font-size:26px;font-weight:900}
.cards3 span{font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:800}
.vs{display:flex;align-items:center;gap:10px;background:var(--edge);border-radius:24px;padding:16px;margin-bottom:16px}
.vs .p{flex:1;text-align:center}
.vs .p b{display:block;font-size:44px;font-weight:900}
.vs .p span{font-weight:800;letter-spacing:2px;font-size:14px;color:var(--muted)}
.vs .p.win b{color:var(--gold)}
.vs .x{font-weight:900;color:var(--orange);font-size:22px;letter-spacing:2px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;letter-spacing:2px;color:var(--muted);text-align:right;padding:10px 8px;font-weight:800}
th:first-child,td:first-child{text-align:left}
td{padding:14px 8px;text-align:right;font-weight:800;border-top:3px solid var(--edge);font-size:17px}
td.me{color:var(--mint)}
td.lead{color:var(--gold)}
.note{font-size:14px;color:var(--muted);line-height:1.45;font-weight:500}
.box{background:#271e5a;border:5px solid var(--edge);border-radius:24px;padding:8px 12px}

/* ---------- fight ---------- */
#fight{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#fight .fin{flex:1;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;padding:0 14px;min-height:0}
.fhead{display:flex;align-items:center;justify-content:space-between;padding:18px 4px 16px}
.fhead .n{font-weight:900;letter-spacing:3px;font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fhead .t{font-weight:900;letter-spacing:3px;font-size:19px;margin:0 18px}
.fhead .leave{color:var(--orange);font-weight:900;letter-spacing:3px;font-size:18px;flex:none}
.arena{position:relative;border-radius:26px;overflow:hidden;border:4px solid #241b52;height:30vh;min-height:180px}
.arena .bg,.arena .bg svg{position:absolute;inset:0;width:100%;height:100%}
.arena .creature{position:absolute;left:50%;top:44%;height:62%;transform:translate(-50%,-50%);animation:bob2 3s ease-in-out infinite}
@keyframes bob2{50%{transform:translate(-50%,calc(-50% - 6px))}}
.arena .creature.hit{animation:hit .3s}
@keyframes hit{0%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% + 10px),-50%) scale(.94);filter:brightness(0) invert(1)}60%{transform:translate(calc(-50% - 6px),-50%)}100%{transform:translate(-50%,-50%)}}
.arena .creature.die{animation:die .7s forwards}
@keyframes die{0%{filter:brightness(0) invert(1)}100%{transform:translate(-50%,-30%) scale(.2) rotate(30deg);opacity:0}}
.arena .creature.enter{animation:enter .5s}
@keyframes enter{from{transform:translate(60%,-50%);opacity:0}}
.arena .hp{position:absolute;left:16px;right:16px;bottom:14px}
.slash{position:absolute;left:20%;top:20%;width:60%;height:50%;pointer-events:none}
.slash path{stroke:#fff;stroke-width:10;stroke-linecap:round;fill:none;stroke-dasharray:300;stroke-dashoffset:300;animation:sl .28s forwards}
@keyframes sl{60%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.dmgpop{position:absolute;font-weight:900;font-size:34px;color:#fff;-webkit-text-stroke:2px var(--edge);pointer-events:none;animation:pop .8s forwards}
.dmgpop.crit{color:var(--gold);font-size:44px}
@keyframes pop{0%{transform:scale(.4)}20%{transform:scale(1.15)}100%{transform:translateY(-70px);opacity:0}}
.banner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0008;animation:fade 1.6s forwards;pointer-events:none}
.banner b{font-size:40px;font-weight:900;letter-spacing:6px;color:var(--gold);-webkit-text-stroke:2px var(--edge)}
.banner span{font-weight:900;font-size:24px;color:var(--sky);letter-spacing:3px}
@keyframes fade{0%{opacity:0;transform:scale(1.3)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.mid{flex:1;display:flex;gap:14px;margin:18px 0;min-height:0}
.col{width:44px;display:flex;flex-direction:column;align-items:center}
.col .lbl{font-weight:900;color:var(--orange);font-size:14px;letter-spacing:2px;white-space:nowrap;display:flex;gap:4px;align-items:center;margin-bottom:10px}
.col .lbl svg{width:10px;height:18px}
.vbar{flex:1;width:30px;border:5px solid #4a3f8a;border-radius:999px;position:relative;overflow:hidden}
.vbar i{position:absolute;left:0;right:0;bottom:0;background:var(--mint);border-radius:999px;transition:height .1s}
.vbar.batt i{background:var(--orange);transition:height .4s}
.swmeter{width:40px;display:flex;flex-direction:column;align-items:center}
.swmeter svg.top{width:44px;height:84px;margin-bottom:-6px;position:relative;z-index:1}
.swmeter .track{flex:1;width:34px;background:#1a1440;border-radius:0 0 999px 999px;position:relative;overflow:hidden}
.swmeter .track i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--mint),#2fa874);transition:height .08s}
.swmeter .track .tick{position:absolute;left:10px;right:10px;height:3px;background:#4a3f8a;border-radius:3px}
.swmeter.go .track i{background:var(--gold)}
.cam{flex:1;position:relative;border-radius:30px;overflow:hidden;background:#000}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.status{position:absolute;left:10px;right:10px;top:14px;text-align:center;font-weight:900;letter-spacing:1px;font-size:17px;text-shadow:0 2px 6px #000}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;text-shadow:0 4px 24px #000;-webkit-text-stroke:3px var(--edge)}
.count.go{color:var(--gold)}
.combo{position:absolute;right:12px;bottom:12px;background:#000a;border-radius:14px;padding:6px 12px;font-weight:900;color:var(--gold);letter-spacing:2px}
.fstats{display:flex;background:#3a2f7a;padding:22px 0 18px;margin:0 -14px}
.fstats div{flex:1;text-align:center}
.fstats b{display:block;font-size:46px;font-weight:900;line-height:1}
.fstats span{font-weight:800;letter-spacing:4px;font-size:15px;color:#cfc8f2}

.planettag{align-self:center;margin-top:10px;background:#0006;color:var(--gold);font-weight:800;letter-spacing:4px;font-size:13px;padding:5px 14px;border-radius:999px}
.planetpic{position:relative;height:190px;border-radius:22px;overflow:hidden;margin:14px 0;border:5px solid var(--edge);animation:zoom 1.2s ease-out}
.planetpic svg{position:absolute;inset:0;width:100%;height:100%}
.planetpic .c{position:absolute;left:25%;top:12%;width:50%;height:80%;animation:bob 3s ease-in-out infinite}
.pname{font-size:38px;font-weight:900;letter-spacing:6px;color:var(--gold);margin:2px 0 8px;animation:glow 1.5s ease-in-out infinite alternate}
@keyframes zoom{from{transform:scale(1.4);filter:brightness(3)}}
@keyframes glow{to{text-shadow:0 0 18px #f5b85a}}
/* ---------- modals ---------- */
.modal{position:fixed;inset:0;background:#0b0820d0;z-index:50;display:flex;align-items:center;justify-content:center;padding:22px}
.sheet{width:100%;max-width:420px;background:#2a2160;border:6px solid var(--edge);border-radius:30px;padding:24px;text-align:center;animation:rise .25s}
@keyframes rise{from{transform:translateY(30px) scale(.95);opacity:0}}
.sheet h3{margin:0 0 6px;font-size:28px;font-weight:900;letter-spacing:4px}
.sheet .sub{color:var(--muted);font-weight:700;letter-spacing:1px;line-height:1.4}
.sheet .art{margin:10px auto}
.sheet .art svg{width:150px;height:150px}
.rays{position:relative}
.rays:before{content:"";position:absolute;inset:-20px;background:repeating-conic-gradient(#f5b85a33 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 8s linear infinite;z-index:0}
.rays svg{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.sheet .stats2{display:flex;gap:10px;margin:16px 0}
.sheet .stats2 div{flex:1;background:var(--edge);border-radius:16px;padding:12px 4px}
.sheet .stats2 b{display:block;font-size:24px;font-weight:900}
.sheet .stats2 span{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--muted)}
.btn{display:block;width:100%;background:var(--mint);color:#0d3524;font-weight:900;letter-spacing:3px;font-size:20px;padding:16px;border-radius:999px;border:5px solid var(--edge);margin-top:12px}
.btn.or{background:var(--orange);color:#fff}
.btn.gd{background:var(--gold);color:#3b2400}
.btn.dim{background:var(--panel2);color:#fff}
.btn:disabled{opacity:.5}
input{width:100%;font:inherit;font-size:20px;font-weight:700;padding:14px 16px;border-radius:16px;border:4px solid var(--edge);background:var(--edge);color:#fff;margin:14px 0 4px;text-align:center;-webkit-user-select:text;user-select:text}
.toggle{display:flex;justify-content:space-between;align-items:center;background:var(--edge);border-radius:16px;padding:14px 16px;margin-top:10px;font-weight:800;letter-spacing:1px}
.toggle i{width:52px;height:30px;border-radius:999px;background:#4a3f8a;position:relative;transition:.2s}
.toggle i:after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on i{background:var(--mint)}
.toggle.on i:after{left:26px}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 18px);transform:translateX(-50%);background:#2a2160;border:4px solid var(--edge);padding:12px 20px;border-radius:999px;font-weight:800;z-index:60;white-space:nowrap;animation:rise .25s}
</style>
</head>
<body>

<!-- ================= BOSS ================= -->
<section class="screen" id="boss">
  <div class="land" id="bossLand"></div>
  <div class="bossui">

/* ============ IDLE (battery-powered forge + mine) ============ */
const idleDmg=()=>blade(S.equipped).dmg*0.01*S.forge;   // per second
const idleGems=()=>blade(S.equipped).dmg*0.01*S.mine;   // per second
function applyDamage(d){
  let kills=0,gems=0;
  while(d>0){
    if(d>=S.bossHp){d-=S.bossHp;const b=bossAt(S.boss);gems+=b.worth;kills++;S.boss++;S.bossHp=bossAt(S.boss).hp}
    else{S.bossHp-=d;d=0}
  }
  S.gems+=gems;return{kills,gems};
}
function tickIdle(){
  const now=Date.now(),dt=Math.max(0,(now-S.lastTick)/1000);S.lastTick=now;
  const act=Math.min(dt,S.battery);S.battery=Math.max(0,S.battery-dt);
  if(act<=0)return{act:0,dmg:0,gems:0,kills:0};
  const dmg=act*idleDmg(),g=act*idleGems();S.gems+=g;
  const r=applyDamage(dmg);return{act,dmg,gems:g+r.gems,kills:r.kills};
}

/* ============ LEADERBOARD (Supabase) ============ */
let rivals=[],syncErr="";
const online=()=>SUPABASE_URL&&SUPABASE_KEY;
const base=()=>SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/players";
function hdr(){const h={apikey:SUPABASE_KEY,"Content-Type":"application/json"};if(SUPABASE_KEY.startsWith("eyJ"))h.Authorization="Bearer "+SUPABASE_KEY;return h}
function recent(){const o={},c=new Date();c.setDate(c.getDate()-60);const ck=dayKey(c);for(const k in S.days)if(k>=ck)o[k]=S.days[k];return o}
async function sync(){
  if(!online()||!S.name)return;
  try{const r=await fetch(base(),{method:"POST",headers:{...hdr(),Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify({id:S.id,name:S.name,total_reps:S.totalReps,days:recent(),boss:S.boss,blade:S.owned,updated_at:new Date().toISOString()})});
    if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,100));syncErr=""}catch(e){syncErr=e.message||String(e)}
  pull();
}
async function pull(){
  if(!online()){renderBoard();return}
  try{const r=await fetch(base()+"?select=*",{headers:hdr()});if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,100));rivals=await r.json();syncErr=""}catch(e){syncErr=e.message||String(e)}
  renderBoard();
}
function bossLabel(g){const w=planetOf(g);if(w>planetOf(S.boss)&&planetOf(S.boss)===0)return"👑";return w?`P${w+1}·${slotOf(g)+1}`:String(slotOf(g)+1)}
function renderBoard(){
  const me={id:S.id,name:S.name||"You",total_reps:S.totalReps,days:S.days,boss:S.boss};
  const list=[me,...rivals.filter(p=>p.id!==S.id)].map(p=>({...p,today:(p.days||{})[dayKey()]||0,week:sumWeek(p.days||{})}));
  list.sort((a,b)=>b.today-a.today||b.week-a.week||b.total_reps-a.total_reps);
  const mx=k=>Math.max(...list.map(p=>p[k]||0));const M={today:mx("today"),week:mx("week"),total_reps:mx("total_reps"),boss:mx("boss")};
  const td=(p,k,s)=>`<td class="${list.length>1&&p[k]===M[k]&&p[k]>0?"lead":""}">${s}</td>`;
  $("board").innerHTML=list.map(p=>`<tr><td class="${p.id===S.id?"me":""}">${esc(p.name)}</td>${td(p,"today",fmt(p.today))}${td(p,"week",fmt(p.week))}${td(p,"total_reps",fmt(p.total_reps))}${td(p,"boss",bossLabel(p.boss))}</tr>`).join("");
  const rival=list.find(p=>p.id!==S.id);
  $("vsCard").innerHTML=rival?`<div class="p ${me.today>=rival.today&&me.today>0?"win":""}"><b>${list.find(p=>p.id===S.id).today}</b><span>${esc(me.name).toUpperCase()}</span></div><div class="x">VS<br><span style="font-size:11px;color:var(--muted)">TODAY</span></div><div class="p ${rival.today>me.today?"win":""}"><b>${rival.today}</b><span>${esc(rival.name).toUpperCase()}</span></div>`
    :`<div class="p"><b>${S.days[dayKey()]||0}</b><span>YOUR REPS TODAY</span></div>`;
  $("syncNote").textContent=!online()?"Leaderboard offline: paste your Supabase URL and key at the top of index.html.":syncErr?`Can't reach the leaderboard right now (${syncErr}). Reps are saved on this phone and sync next time.`:"Gold = leading that column. Updates after every fight.";
}

/* ============ FIGHT ============ */
let lmk=null,stream=null,fighting=false,raf=0,wake=null,lastVT=-1;
let ses={reps:0,dmg:0,gems:0,start:0,kills:0};
let det={state:"up",up:null,sm:null,downAt:0,last:0,lost:0,armed:false};
let combo=0,comboT=0;

async function loadPose(){
  if(lmk)return lmk;
  const V="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const {PoseLandmarker,FilesetResolver}=await import(V+"/vision_bundle.mjs");
  const files=await FilesetResolver.forVisionTasks(V+"/wasm");
  const o=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:d},runningMode:"VIDEO",numPoses:1});
  try{lmk=await PoseLandmarker.createFromOptions(files,o("GPU"))}catch(e){lmk=await PoseLandmarker.createFromOptions(files,o("CPU"))}
  return lmk;
}
function renderFight(){
  const k=curBoss(),b=bossAt(k),hp=S.bossHp,p=hp/b.hp*100;
  $("fName").textContent=b.name.toUpperCase();
  $("fHp").style.width=p+"%";$("fHpG").style.width=p+"%";
  $("fHpT").textContent=`HP: ${fmt(Math.ceil(hp))} / ${fmt(b.hp)}`;
  $("sDmg").textContent=fmt(ses.dmg);$("sReps").textContent=ses.reps;$("sGems").textContent=fmt(ses.gems);
  const bp=Math.round(S.battery/BATT_MAX*100);$("fBattP").textContent=bp+"%";$("fBatt").style.height=bp+"%";
}
function setFightBoss(enter){const a=$("fArt");a.innerHTML=creature(curBoss());a.className="creature"+(enter?" enter":"")}

$("fightBtn").onclick=async()=>{
  if(!S.name){askName();return}
  viewBoss=null;ac();
  $("fight").classList.remove("hidden");$("fLand").innerHTML=landscape("f",planetOf(S.boss));setFightBoss(false);
  $("swTop").innerHTML=sword(S.equipped,40).replace(/^<svg[^>]*>/,"").replace(/<\/svg>$/,"");$("swTop").setAttribute("viewBox","0 0 100 110");
  $("depth").parentElement.querySelectorAll(".tick").forEach(t=>t.remove());
  for(let i=1;i<10;i++){const t=document.createElement("div");t.className="tick";t.style.bottom=(i*10)+"%";$("depth").parentElement.appendChild(t)}
  ses={reps:0,dmg:0,gems:0,start:0,kills:0};combo=0;renderFight();
  $("status").textContent="Starting camera…";
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},audio:false})}
  catch(e){endFight(true);modal(`<h3>CAMERA BLOCKED</h3><div class="sub">Push-ups only count on camera. In Safari tap <b>aA → Website Settings → Camera → Allow</b>, then hit FIGHT again.</div><button class="btn" id="cl">OK</button>`,s=>s.querySelector("#cl").onclick=close);return}
  const v=$("video");v.srcObject=stream;await v.play().catch(()=>{});
  $("status").textContent="Loading rep counter…";
  try{await loadPose()}catch(e){endFight(true);modal(`<h3>COULDN'T LOAD</h3><div class="sub">The rep counter didn't download. Check your connection and try again.<br><small>${esc(e.message||e)}</small></div><button class="btn" id="cl">OK</button>`,s=>s.querySelector("#cl").onclick=close);return}
  try{wake=await navigator.wakeLock?.request("screen")}catch(e){}
  fighting=true;ses.start=Date.now();det={state:"up",up:null,sm:null,downAt:0,last:0,lost:0,armed:false};
  countdown();loop();
};
function countdown(){
  const el=$("count");let n=5;el.className="count";el.textContent=n;SFX.tick();
  $("status").textContent="Get in push-up position";
  const iv=setInterval(()=>{if(!fighting){clearInterval(iv);el.classList.add("hidden");return}
    n--;if(n>0){el.textContent=n;SFX.tick()}
    else if(n===0){el.textContent="GO!";el.classList.add("go");SFX.go();det.armed=true;det.up=det.sm;det.state="up";$("status").textContent=""}
    else{clearInterval(iv);el.classList.add("hidden")}},1000);
}
$("leaveBtn").onclick=()=>endFight(false);
function endFight(silent){
  fighting=false;cancelAnimationFrame(raf);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  try{wake?.release()}catch(e){}wake=null;
  $("fight").classList.add("hidden");$("count").classList.add("hidden");$("combo").classList.add("hidden");
  save();render();
  if(!silent&&ses.reps>0){
    sync();
    const secs=Math.floor((Date.now()-ses.start)/1000);
    modal(`<h3>SESSION DONE</h3><div class="sub">${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")} on the clock${ses.kills?` · <b style="color:var(--gold)">${ses.kills} boss${ses.kills>1?"es":""} down</b>`:""}</div>
      <div class="stats2"><div><b>${ses.reps}</b><span>PUSHUPS</span></div><div><b>${fmt(ses.dmg)}</b><span>DAMAGE</span></div><div><b style="color:var(--sky)">${fmt(ses.gems)}</b><span>CRYSTALS</span></div></div>
      <div class="sub">Battery charged to <b style="color:#fff">${dur(S.battery)}</b>. Today: <b style="color:#fff">${S.days[dayKey()]||0}</b> reps</div>
      <button class="btn" id="cl">COLLECT</button>`,s=>s.querySelector("#cl").onclick=()=>{close();renderGems(true);SFX.buy()});
  }
}
function loop(){
  if(!fighting)return;
  const v=$("video");
  if(v.readyState>=2&&v.currentTime!==lastVT&&lmk){lastVT=v.currentTime;let r=null;try{r=lmk.detectForVideo(v,performance.now())}catch(e){}if(r)onPose(r,v)}
  if(ses.start){const s=Math.floor((Date.now()-ses.start)/1000);$("fTime").textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
  if(combo&&performance.now()-comboT>3500){combo=0;$("combo").classList.add("hidden")}
  raf=requestAnimationFrame(loop);
}
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24]];
function drawPose(lm,v){
  const c=$("overlay"),W=c.clientWidth,H=c.clientHeight;if(c.width!==W*2){c.width=W*2;c.height=H*2}
  const x=c.getContext("2d");x.setTransform(2,0,0,2,0,0);x.clearRect(0,0,W,H);if(!lm)return;
  const vw=v.videoWidth,vh=v.videoHeight,sc=Math.max(W/vw,H/vh),ox=(W-vw*sc)/2,oy=(H-vh*sc)/2,P=p=>[p.x*vw*sc+ox,p.y*vh*sc+oy];
  x.lineWidth=9;x.lineCap="round";x.strokeStyle=det.state==="down"?"#5fe0a0":"#ec6440d0";
  for(const[a,b]of BONES){const A=lm[a],B=lm[b];if((A.visibility??1)<.4||(B.visibility??1)<.4)continue;const[x1,y1]=P(A),[x2,y2]=P(B);x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke()}
  x.fillStyle=det.state==="down"?"#5fe0a0":"#ec6440";for(const i of[11,12,13,14,15,16]){const p=lm[i];if((p.visibility??1)<.4)continue;const[a,b]=P(p);x.beginPath();x.arc(a,b,8,0,7);x.fill()}
}
function onPose(res,v){
  const now=performance.now(),lm=res.landmarks&&res.landmarks[0];
  const ok=lm&&(lm[11].visibility??1)>.4&&(lm[12].visibility??1)>.4;
  drawPose(ok?lm:null,v);
  if(!ok){if(!det.lost)det.lost=now;if(now-det.lost>1000){det.state="up";det.up=null;det.sm=null;if(det.armed)$("status").textContent="Get your shoulders in frame"}$("depth").style.height="0%";return}
  det.lost=0;
  const W=v.videoWidth,H=v.videoHeight;
  const s=Math.hypot((lm[11].x-lm[12].x)*W,(lm[11].y-lm[12].y)*H)/H;   // shoulder width ≈ how close you are to the phone
  det.sm=det.sm==null?s:det.sm*.55+s*.45;
  if(!det.armed)return;
  if(det.up==null){det.up=det.sm;return}
  const ratio=det.sm/det.up,fill=Math.max(0,Math.min(100,(ratio-1)/(DOWN_RATIO-1)*100));
  $("depth").style.height=fill+"%";$("swm").classList.toggle("go",fill>=100);
  if(det.state==="up"){
    if(det.sm<det.up)det.up=det.sm;else if(ratio<1.08)det.up+=(det.sm-det.up)*.02;
    if(ratio>=DOWN_RATIO){det.state="down";det.downAt=now;$("status").textContent="UP!"}
  }else{
    if(now-det.downAt>4000){det.state="up";det.up=det.sm;$("status").textContent="Recalibrated, keep going";return}
    if(ratio<=1+(DOWN_RATIO-1)*.35&&now-det.downAt>150){
      det.state="up";
      if(now-det.last>=MIN_REP_MS){det.last=now;rep()}else{$("status").textContent="Too fast, full reps only";SFX.err()}
    }
  }
}
function rep(){
  const k=dayKey(),base=blade(S.equipped).dmg,crit=Math.random()<CRIT_CHANCE,dmg=crit?base*2:base;
  S.totalReps++;S.days[k]=(S.days[k]||0)+1;S.best=Math.max(S.best||0,S.days[k]);
  S.battery=Math.min(BATT_MAX,S.battery+BATT_PER_REP);
  S.gems+=base;ses.gems+=base;ses.reps++;ses.dmg+=dmg;
  combo++;comboT=performance.now();if(combo>=3){$("combo").textContent=`COMBO x${combo}`;$("combo").classList.remove("hidden")}
  $("status").textContent=crit?"CRITICAL!":"";
  SFX.hit(crit);
  const a=$("fArt");a.classList.remove("hit","enter");void a.offsetWidth;a.classList.add("hit");
  const ar=$("arena");
  const sl=document.createElementNS("http://www.w3.org/2000/svg","svg");sl.setAttribute("class","slash");sl.setAttribute("viewBox","0 0 100 100");
  const flip=Math.random()<.5;sl.innerHTML=`<path d="M${flip?90:10} 10 L${flip?10:90} 90"/>`;ar.appendChild(sl);setTimeout(()=>sl.remove(),320);
  const p=document.createElement("div");p.className="dmgpop"+(crit?" crit":"");p.textContent=(crit?"CRIT -":"-")+fmt(dmg);
  p.style.left=(30+Math.random()*40)+"%";p.style.top=(15+Math.random()*25)+"%";ar.appendChild(p);setTimeout(()=>p.remove(),800);
  {
    const b=bossAt(S.boss);const r=applyDamage(dmg);
    if(r.kills){ses.kills+=r.kills;ses.gems+=r.gems;bossDown(b,r.gems)}
    else{$("fHp").style.width=(S.bossHp/b.hp*100)+"%";setTimeout(()=>$("fHpG").style.width=(S.bossHp/b.hp*100)+"%",50)}
  }
  save();renderFight();renderGems(true);
}
function bossDown(b,g){
  SFX.kill();
  const a=$("fArt");a.classList.remove("hit");void a.offsetWidth;a.classList.add("die");
  const bn=document.createElement("div");bn.className="banner";bn.innerHTML=`<b>DEFEATED!</b><span>+◆ ${fmt(g)}</span>`;$("arena").appendChild(bn);setTimeout(()=>bn.remove(),1600);
  setTimeout(()=>{$("fLand").innerHTML=landscape("f",planetOf(S.boss));setFightBoss(true);renderFight();if(!checkPlanet())toast(`New boss: ${bossAt(S.boss).name}`)},900);
  sync();
}

/* ============ NEW PLANET REVEAL ============ */
function checkPlanet(){
  const w=planetOf(S.boss);if(w<=(S.seenPlanet||0))return false;
  S.seenPlanet=w;save();render();
  SFX.kill();setTimeout(()=>SFX.buy(),500);
  modal(`<div class="sub" style="letter-spacing:4px;font-weight:800;color:var(--gold)">${w===1?"WAIT… THERE'S MORE":"PLANET CLEARED"}</div>
    <div class="planetpic">${landscape("np",w)}<div class="c">${creature(w*PER_PLANET)}</div></div>
    <h3>NEW PLANET</h3><div class="pname">${planetName(w).toUpperCase()}</div>
    <div class="sub">${PER_PLANET} new bosses. They hit way harder, so keep upgrading that sword.</div>
    <button class="btn or" id="cl">EXPLORE</button>`,s=>s.querySelector("#cl").onclick=()=>{close();SFX.go()});
  return true;
}

/* ============ BOOT ============ */
if(!(S.bossHp>0)||S.bossHp>bossAt(S.boss).hp)S.bossHp=bossAt(S.boss).hp;
$("forgeArt").innerHTML=FORGE;$("mineArt").innerHTML=MINE;
const away=tickIdle();save();render();
if(!S.name)askName();
else{
  sync();
  if(checkPlanet()){}else if(away.act>30&&(away.dmg>=1||away.gems>=1))modal(`<h3>WELCOME BACK</h3><div class="sub">Your battery ran for <b style="color:#fff">${dur(away.act)}</b> while you were gone</div>
    <div class="stats2"><div><b>${fmt(away.dmg)}</b><span>FORGE DMG</span></div><div><b style="color:var(--sky)">${fmt(away.gems)}</b><span>MINED ◆</span></div>${away.kills?`<div><b style="color:var(--gold)">${away.kills}</b><span>BOSSES</span></div>`:""}</div>
    <button class="btn" id="cl">COLLECT</button>`,s=>s.querySelector("#cl").onclick=()=>{close();SFX.buy();renderGems(true)});
}
setInterval(()=>{const r=tickIdle();save();if(!fighting){renderGems();renderBoss();if(r.kills&&!checkPlanet())toast("Your forge took down a boss!")}else renderFight()},2000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){tickIdle();save();render();pull()}});
</script>
</body>
